<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleverPay Model Lab</title>
<meta name="description" content="Score mobile-money transactions with four LightGBM fraud models in your browser, with exact SHAP explanations.">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./css/site.css">
<style>
.hero { padding: 34px 0 10px; max-width: 820px; }
.hero h1 { font-size: clamp(30px, 4.6vw, 46px); line-height: 1.05; margin: 0 0 12px; letter-spacing: -.6px; }
.hero p { color: var(--soft); margin: 0 0 8px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 16px; }
.preset { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 9px 13px; text-align: left; }
.preset small { display: block; color: var(--muted); font-size: 12.5px; }
.preset.on { border-color: var(--brand); background: #12261f; }
.lab { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; }
@media (max-width: 920px) { .lab { grid-template-columns: 1fr; } }
.ctl { display: flex; flex-direction: column; gap: 14px; }
.ctl label, .ctl .lbl { font-size: 13px; color: var(--muted); display: block; margin-bottom: 5px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { flex: 1 1 auto; background: none; border: 0; color: var(--soft); padding: 6px 8px; border-radius: 7px; font-size: 13.5px; }
.seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--brand); }
select.in, input[type=range] { width: 100%; }
select.in { background: var(--bg-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
input[type=range] { accent-color: var(--brand); }
.val { font: 600 14px var(--mono); color: var(--text); float: right; }
.story { background: var(--bg-2); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; color: var(--soft); font-size: 14px; }
.models { display: flex; flex-direction: column; gap: 12px; }
.mrow { display: grid; grid-template-columns: 120px 1fr 92px; gap: 12px; align-items: center; cursor: pointer; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
.mrow:hover { background: var(--panel-2); }
.mrow.sel { border-color: var(--line); background: var(--panel-2); }
.mrow .nm { font-weight: 650; }
.mrow .nm small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.gauge { position: relative; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #1f4d3d 0 var(--r), #5a4a1d var(--r) var(--b), #5a2420 var(--b) 100%); }
.gauge .needle { position: absolute; top: -5px; width: 4px; height: 24px; background: #fff; border-radius: 2px; transition: left .45s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 0 2px #000a; }
.gauge .sc { position: absolute; top: -22px; font: 600 12px var(--mono); transform: translateX(-50%); white-space: nowrap; transition: left .45s cubic-bezier(.2,.8,.2,1); }
.scale { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); margin: 4px 130px 0 132px; }
@media (max-width: 600px) { .presets { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; } .preset { flex: 0 0 auto; }
  .wf .r { grid-template-columns: minmax(0, 1fr) 90px 52px; } }
@media (max-width: 600px) { .mrow { grid-template-columns: 1fr; gap: 6px; } .scale { margin: 4px 0 0; } }
.why { margin-top: 16px; }
.wf { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.wf .r { display: grid; grid-template-columns: minmax(0, 1fr) 160px 64px; gap: 10px; align-items: center; font-size: 13.5px; }
.wf .r .f small { color: var(--muted); font-family: var(--mono); }
.wf .bar { position: relative; height: 12px; }
.wf .bar span { position: absolute; top: 0; height: 12px; border-radius: 3px; }
.wf .bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.wf .num { font: 12.5px var(--mono); text-align: right; }
.wf .up { background: var(--bad); } .wf .down { background: var(--good); }
.reasons { margin: 12px 0 0; padding-left: 18px; }
.reasons li { margin: 3px 0; }
.timing { font: 12.5px var(--mono); color: var(--muted); margin-top: 12px; }
section.block { margin-top: 44px; }
section.block h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.3px; }
section.block > p { color: var(--soft); max-width: 820px; margin: 0 0 16px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 500; font-size: 12.5px; text-transform: uppercase; letter-spacing: .6px; }
table.t td.n { font-family: var(--mono); text-align: right; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.minibar { display: inline-block; height: 8px; border-radius: 4px; background: var(--brand); vertical-align: middle; margin-right: 6px; }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--soft); margin-top: 8px; }
.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.pipeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.pipeline .step { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; color: var(--soft); }
.pipeline .step b { display: block; color: var(--text); margin-bottom: 4px; }
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="loading"><span class="spinner"></span> Loading the models and the network…</div>
</main>
<script type="module" src="./js/lab/lab.js"></script>
</body>
</html>
